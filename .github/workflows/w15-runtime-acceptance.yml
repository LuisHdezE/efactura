name: W1.5 Runtime Acceptance

on:
  push:
    branches:
      - ops/w15-runtime-acceptance-20260921
    paths:
      - '.github/workflows/w15-runtime-acceptance.yml'
      - 'scripts/ops/w15_runtime_acceptance.py'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: efactura-demo-0916-9b93
  REGION: us-east5
  SERVICE: efactura-api
  WIF_PROVIDER: projects/195831190862/locations/global/workloadIdentityPools/github-actions/providers/efactura-main
  DEPLOY_SERVICE_ACCOUNT: efactura-deploy@efactura-demo-0916-9b93.iam.gserviceaccount.com
  JWT_SECRET: efactura-jwt-key
  ACCEPTED_MAIN_SHA: bc138d6076a6d9f2f8f948171082511e9385b39f
  ACCEPTED_REVISION: efactura-api-d22-11139c7-54-1

jobs:
  acceptance:
    name: Governed W1.5 runtime acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout acceptance source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 8

      - name: Verify isolated operational delta
        shell: bash
        run: |
          set -euo pipefail
          merge_base="$(git merge-base HEAD "$ACCEPTED_MAIN_SHA")"
          [[ "$merge_base" == "$ACCEPTED_MAIN_SHA" ]]
          unexpected="$(git diff --name-only "$ACCEPTED_MAIN_SHA"..HEAD | grep -Ev '^(\.github/workflows/w15-runtime-acceptance\.yml|scripts/ops/w15_runtime_acceptance\.py)$' || true)"
          [[ -z "$unexpected" ]]
          echo "Acceptance harness is isolated from accepted API baseline $ACCEPTED_MAIN_SHA"

      - name: Validate acceptance runner syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ops/w15_runtime_acceptance.py
          echo "W1.5 acceptance runner syntax PASS"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify accepted Cloud Run revision
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --platform=managed --format=json)"
          revision="$(jq -r '.status.traffic[] | select((.percent // 0) == 100) | .revisionName // empty' <<< "$service_json" | head -n1)"
          base_url="$(jq -r '.status.url // empty' <<< "$service_json")"
          echo "100% revision: $revision"
          [[ "$revision" == "$ACCEPTED_REVISION" ]]
          [[ -n "$base_url" ]]
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"

      - name: Run W1.5 production runtime acceptance
        shell: bash
        env:
          BASE_URL: ${{ steps.runtime.outputs.base_url }}
          W15_STAMP: ${{ github.run_id }}
          W15_SUMMARY_PATH: ${{ runner.temp }}/w15-runtime-summary.json
        run: |
          set -euo pipefail
          JWT_KEY="$(gcloud secrets versions access latest --project="$PROJECT_ID" --secret="$JWT_SECRET")"
          [[ -n "$JWT_KEY" ]]
          echo "::add-mask::$JWT_KEY"
          export JWT_KEY
          export JWT_ISSUER="$(jq -r '.Jwt.Issuer' src/WebApi/appsettings.json)"
          export JWT_AUDIENCE="$(jq -r '.Jwt.Audience' src/WebApi/appsettings.json)"

          python3 scripts/ops/w15_runtime_acceptance.py

          unset JWT_KEY JWT_ISSUER JWT_AUDIENCE
          echo "### W1.5 Runtime Acceptance" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$W15_SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
