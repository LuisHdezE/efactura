name: Clean Architecture Guard

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/ArchitectureTests/**'
      - 'test/CrossCuttingTests/**'
      - 'test/UnitTest/**'
      - 'test/PersistenceIntegrationTests/**'
      - 'api-accounting.sln'
      - 'global.json'
      - 'Dockerfile'
      - '.github/workflows/clean-architecture.yml'
  push:
    branches: [main, blueprint/dependency-security-modernization]
    paths:
      - 'src/**'
      - 'test/ArchitectureTests/**'
      - 'test/CrossCuttingTests/**'
      - 'test/UnitTest/**'
      - 'test/PersistenceIntegrationTests/**'
      - 'api-accounting.sln'
      - 'global.json'
      - 'Dockerfile'
      - '.github/workflows/clean-architecture.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Build and architecture tests
    runs-on: [self-hosted, linux, x64, efactura-ci]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure isolated job caches
        shell: bash
        run: |
          set -euo pipefail
          cache_root="${RUNNER_TEMP}/dotnet-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          mkdir -p "${cache_root}/packages" "${cache_root}/http" "${cache_root}/scratch" "${cache_root}/cli-home"
          echo "DOTNET_INSTALL_DIR=${RUNNER_TOOL_CACHE}/dotnet" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=${cache_root}/packages" >> "$GITHUB_ENV"
          echo "NUGET_HTTP_CACHE_PATH=${cache_root}/http" >> "$GITHUB_ENV"
          echo "NUGET_SCRATCH=${cache_root}/scratch" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_HOME=${cache_root}/cli-home" >> "$GITHUB_ENV"
          echo "DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
          echo "DOTNET_NOLOGO=1" >> "$GITHUB_ENV"

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify .NET CLI responsiveness
        shell: bash
        run: timeout 30s dotnet --info

      - name: Restore projects sequentially
        shell: bash
        run: |
          set -euo pipefail

          restore_project() {
            project="$1"
            echo "::group::Restore ${project}"
            timeout 3m dotnet restore "$project" --disable-parallel --verbosity minimal || {
              rc=$?
              echo "::error::Restore failed or timed out for ${project} (exit ${rc})."
              exit "$rc"
            }
            echo "::endgroup::"
          }

          restore_project src/Domain/Domain.csproj
          restore_project src/Application/Application.csproj
          restore_project src/ApplicationCore/ApplicationCore.csproj
          restore_project src/Shared/Shared.csproj
          restore_project src/Infrastructure/Infrastructure.csproj
          restore_project src/WebApi/WebApi.csproj
          restore_project test/ArchitectureTests/ArchitectureTests.csproj
          restore_project test/CrossCuttingTests/CrossCuttingTests.csproj
          restore_project test/UnitTest/UnitTest.csproj
          restore_project test/PersistenceIntegrationTests/PersistenceIntegrationTests.csproj

      - name: Enforce NuGet vulnerability gate
        shell: bash
        run: |
          set -euo pipefail
          audit_output="$(mktemp)"
          trap 'rm -f "$audit_output"' EXIT

          dotnet package list --project api-accounting.sln --vulnerable --include-transitive --no-restore | tee "$audit_output"

          if grep -Fq "has the following vulnerable packages" "$audit_output"; then
            echo "::error::Known NuGet vulnerabilities detected. Update or replace the affected dependencies before merging."
            exit 1
          fi

          echo "NuGet vulnerability gate passed: no known vulnerable packages detected."

      - name: Inventory deprecated NuGet packages
        continue-on-error: true
        run: dotnet package list --project api-accounting.sln --deprecated --no-restore

      - name: Inventory outdated NuGet packages
        continue-on-error: true
        run: dotnet package list --project api-accounting.sln --outdated --no-restore

      - name: Build solution
        run: dotnet build api-accounting.sln --configuration Release --no-restore --disable-build-servers

      - name: Run Clean Architecture guard tests
        run: dotnet test test/ArchitectureTests/ArchitectureTests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Run API v1 cross-cutting tests
        run: dotnet test test/CrossCuttingTests/CrossCuttingTests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Run legacy unit tests
        run: dotnet test test/UnitTest/UnitTest.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

  persistence-integration:
    name: PostgreSQL and MySQL transaction tests
    needs: architecture
    runs-on: [self-hosted, linux, x64, efactura-ci]
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: efactura_ci
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: efactura_ci
        ports:
          - 3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure isolated job caches
        shell: bash
        run: |
          set -euo pipefail
          cache_root="${RUNNER_TEMP}/dotnet-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          mkdir -p "${cache_root}/packages" "${cache_root}/http" "${cache_root}/scratch" "${cache_root}/cli-home"
          echo "DOTNET_INSTALL_DIR=${RUNNER_TOOL_CACHE}/dotnet" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=${cache_root}/packages" >> "$GITHUB_ENV"
          echo "NUGET_HTTP_CACHE_PATH=${cache_root}/http" >> "$GITHUB_ENV"
          echo "NUGET_SCRATCH=${cache_root}/scratch" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_HOME=${cache_root}/cli-home" >> "$GITHUB_ENV"
          echo "DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
          echo "DOTNET_NOLOGO=1" >> "$GITHUB_ENV"

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify .NET CLI responsiveness
        shell: bash
        run: timeout 30s dotnet --info

      - name: Run transactional persistence integration tests
        env:
          PERSISTENCE_INTEGRATION_REQUIRED: 'true'
          POSTGRES_TEST_CONNECTION: 'Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Username=postgres;Password=postgres;Database=efactura_ci'
          MYSQL_TEST_CONNECTION: 'Server=127.0.0.1;Port=${{ job.services.mysql.ports[3306] }};User ID=root;Password=rootpass;Database=efactura_ci;SslMode=None;AllowPublicKeyRetrieval=True'
        shell: bash
        run: timeout 20m dotnet test test/PersistenceIntegrationTests/PersistenceIntegrationTests.csproj --configuration Release --logger "console;verbosity=normal"
