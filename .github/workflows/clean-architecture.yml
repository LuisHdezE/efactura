name: Clean Architecture Guard

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/ArchitectureTests/**'
      - 'test/CrossCuttingTests/**'
      - 'test/UnitTest/**'
      - 'test/PersistenceIntegrationTests/**'
      - 'api-accounting.sln'
      - 'global.json'
      - 'Dockerfile'
      - '.github/workflows/clean-architecture.yml'
  push:
    branches: [main, blueprint/dotnet-10-modernization]
    paths:
      - 'src/**'
      - 'test/ArchitectureTests/**'
      - 'test/CrossCuttingTests/**'
      - 'test/UnitTest/**'
      - 'test/PersistenceIntegrationTests/**'
      - 'api-accounting.sln'
      - 'global.json'
      - 'Dockerfile'
      - '.github/workflows/clean-architecture.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Build and architecture tests
    runs-on: [self-hosted, linux, x64, efactura-ci]
    timeout-minutes: 30
    env:
      DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      NUGET_PACKAGES: ${{ runner.tool_cache }}/nuget-packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore api-accounting.sln

      - name: Build solution
        run: dotnet build api-accounting.sln --configuration Release --no-restore

      - name: Run Clean Architecture guard tests
        run: dotnet test test/ArchitectureTests/ArchitectureTests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Run API v1 cross-cutting tests
        run: dotnet test test/CrossCuttingTests/CrossCuttingTests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Run legacy unit tests
        run: dotnet test test/UnitTest/UnitTest.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

  persistence-integration:
    name: PostgreSQL and MySQL transaction tests
    needs: architecture
    runs-on: [self-hosted, linux, x64, efactura-ci]
    timeout-minutes: 30
    env:
      DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      NUGET_PACKAGES: ${{ runner.tool_cache }}/nuget-packages

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: efactura_ci
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: efactura_ci
        ports:
          - 3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run transactional persistence integration tests
        env:
          PERSISTENCE_INTEGRATION_REQUIRED: 'true'
          POSTGRES_TEST_CONNECTION: 'Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Username=postgres;Password=postgres;Database=efactura_ci'
          MYSQL_TEST_CONNECTION: 'Server=127.0.0.1;Port=${{ job.services.mysql.ports[3306] }};User ID=root;Password=rootpass;Database=efactura_ci;SslMode=None;AllowPublicKeyRetrieval=True'
        run: dotnet test test/PersistenceIntegrationTests/PersistenceIntegrationTests.csproj --configuration Release --logger "console;verbosity=normal"
