name: One-shot Daily Report Durable Replay

on:
  push:
    branches:
      - blueprint/fiscal-daily-report-durable-replay
    paths:
      - .github/one-shot/implement-daily-report-durable-replay.py
      - .github/workflows/one-shot-daily-report-durable-replay.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure persistent runner caches
        shell: bash
        run: |
          echo "DOTNET_INSTALL_DIR=${RUNNER_TOOL_CACHE}/dotnet" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=${RUNNER_TOOL_CACHE}/nuget-packages" >> "$GITHUB_ENV"

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: false

      - name: Apply governed patch
        run: python3 .github/one-shot/implement-daily-report-durable-replay.py

      - name: Restore
        run: dotnet restore api-accounting.sln --disable-build-servers

      - name: Build
        run: dotnet build api-accounting.sln --configuration Release --no-restore --disable-build-servers

      - name: Focused architecture tests
        run: dotnet test test/ArchitectureTests/ArchitectureTests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~FiscalDailyReportDurableReplayArchitectureTests --logger "console;verbosity=normal"

      - name: Focused cross-cutting tests
        run: dotnet test test/CrossCuttingTests/CrossCuttingTests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~FiscalDailyReportDurableReplayTests --logger "console;verbosity=normal"

      - name: Commit implementation and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/one-shot/implement-daily-report-durable-replay.py
          rm -f .github/workflows/one-shot-daily-report-durable-replay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 1
          fi
          git commit -m "feat(fiscal): persist daily report signing replay"
          git push origin HEAD:blueprint/fiscal-daily-report-durable-replay
