name: Import DGI XSD v1.44.2 once

on:
  push:
    branches:
      - blueprint/fiscal-signed-xsd-validation
    paths:
      - .github/workflows/import-dgi-xsd-v1-44-2.yml

permissions:
  contents: read

jobs:
  diagnose-dgi-xsd:
    runs-on: [self-hosted, linux, x64, efactura-ci]
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Diagnose official DGI archive response
        shell: bash
        run: |
          set -euo pipefail

          DGI_URL='https://www.efactura.dgi.gub.uy/files/xsds_fe_1_44_2-zip?es='
          REGISTRY='https://www.efactura.dgi.gub.uy/principal/ampliacion_de_contenido/documentos-de-interes?es='
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          BODY="$TMP_DIR/body.bin"
          HEADERS="$TMP_DIR/headers.txt"

          echo 'Requesting official DGI XSD archive with browser-compatible headers...'
          HTTP_CODE="$(curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36' \
            --referer "$REGISTRY" \
            --dump-header "$HEADERS" \
            --output "$BODY" \
            --write-out '%{http_code}' \
            "$DGI_URL")"

          echo "HTTP status: $HTTP_CODE"
          echo '--- final response headers (safe subset) ---'
          tr -d '\r' < "$HEADERS" | grep -Ei '^(HTTP/|content-type:|content-length:|content-disposition:|location:|content-encoding:|server:)' | tail -20 || true
          echo '--- payload diagnostics ---'
          echo "bytes=$(wc -c < "$BODY" | tr -d ' ')"
          echo "file=$(file -b "$BODY")"
          echo -n 'first32.hex='
          od -An -tx1 -N32 "$BODY" | tr -d ' \n'
          echo

          python3 - "$BODY" <<'PY'
          import base64
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          data = path.read_bytes()
          stripped = data.lstrip(b'\xef\xbb\xbf\x00\t\r\n ')

          if stripped.startswith(b'PK\x03\x04'):
              print('representation=zip-with-leading-whitespace-or-bom' if stripped is not data else 'representation=raw-zip')
              raise SystemExit(0)

          lower = stripped[:512].lower()
          if lower.startswith(b'<!doctype html') or lower.startswith(b'<html') or b'<html' in lower:
              print('representation=html')
              preview = re.sub(rb'\s+', b' ', stripped[:240])
              print('preview=' + preview.decode('utf-8', errors='replace'))
              raise SystemExit(0)

          compact = re.sub(rb'\s+', b'', stripped)
          if compact and len(compact) % 4 == 0 and re.fullmatch(rb'[A-Za-z0-9+/=]+', compact):
              try:
                  decoded = base64.b64decode(compact, validate=True)
              except Exception:
                  decoded = b''
              if decoded.startswith(b'PK\x03\x04'):
                  print('representation=base64-encoded-zip')
                  print(f'decoded-bytes={len(decoded)}')
                  raise SystemExit(0)

          print('representation=unknown-non-zip')
          printable = bytes(ch if 32 <= ch <= 126 else 46 for ch in stripped[:160])
          print('ascii-preview=' + printable.decode('ascii', errors='replace'))
          PY
