name: W2.3 Read-only Runtime Acceptance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/w23-readonly-runtime-acceptance.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: efactura-demo-0916-9b93
  REGION: us-east5
  SERVICE: efactura-api
  WIF_PROVIDER: projects/195831190862/locations/global/workloadIdentityPools/github-actions/providers/efactura-main
  DEPLOY_SERVICE_ACCOUNT: efactura-deploy@efactura-demo-0916-9b93.iam.gserviceaccount.com
  JWT_SECRET: efactura-jwt-key
  ACCEPTED_API_SHA: cbfd1926b609b083eed3faa9d79abf3e46cca788
  ACCEPTED_REVISION: efactura-api-d22-cbfd192-57-1

jobs:
  acceptance:
    name: Governed W2.3 read-only runtime acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout acceptance source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify accepted API baseline remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$ACCEPTED_API_SHA" HEAD

          changed="$(git diff --name-only "$ACCEPTED_API_SHA"..HEAD)"
          backend_changed="$(printf '%s\n' "$changed" | grep -E '^(src/(WebApi|Application|Domain|Infrastructure|Shared)/|test/(ArchitectureTests|CrossCuttingTests|PersistenceIntegrationTests|UnitTest|UnitTests)/|api-accounting\.sln$|Directory\.(Build|Packages)\.|global\.json$)' || true)"

          if [[ -n "$backend_changed" ]]; then
            echo "Backend-sensitive changes detected after accepted API baseline:"
            printf '%s\n' "$backend_changed"
            exit 1
          fi

          echo "Accepted W2.3 API baseline remains unchanged."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify accepted Cloud Run revision
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --platform=managed --format=json)"
          revision="$(jq -r '.status.traffic[] | select((.percent // 0) == 100) | .revisionName // empty' <<< "$service_json" | head -n1)"
          base_url="$(jq -r '.status.url // empty' <<< "$service_json")"
          echo "100% revision: $revision"
          [[ "$revision" == "$ACCEPTED_REVISION" ]]
          [[ -n "$base_url" ]]
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"

      - name: Run W2.3 read-only production acceptance
        shell: bash
        env:
          BASE_URL: ${{ steps.runtime.outputs.base_url }}
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/w23-readonly"
          mkdir -p "$tmp"

          header_value() {
            local name="$1"
            local file="$2"
            grep -im1 "^${name}:" "$file" | cut -d: -f2- | sed -E 's/^[[:space:]]+//; s/\r$//'
          }

          openapi_code="$(curl -sS -o "$tmp/openapi.json" -w '%{http_code}' "$BASE_URL/swagger/v1/swagger.json")"
          echo "OpenAPI HTTP $openapi_code"
          [[ "$openapi_code" == "200" ]]

          jq -e '
            .paths["/api/v1/pos/bootstrap"].get.operationId == "getPosBootstrap"
            and (.paths["/api/v1/pos/bootstrap"].post == null)
            and (.paths["/api/v1/pos/bootstrap"].put == null)
            and (.paths["/api/v1/pos/bootstrap"].patch == null)
            and (.paths["/api/v1/pos/bootstrap"].delete == null)
          ' "$tmp/openapi.json" >/dev/null
          echo "OpenAPI W2.3 GET-only surface PASS"

          target="$BASE_URL/api/v1/pos/bootstrap"

          unauth_code="$(curl -sS -o "$tmp/unauth.json" -w '%{http_code}' "$target")"
          echo "W2.3 without JWT HTTP $unauth_code"
          [[ "$unauth_code" == "401" ]]

          malformed_code="$(curl -sS -H 'Authorization: Bearer malformed.jwt.value' -o "$tmp/malformed.json" -w '%{http_code}' "$target")"
          echo "W2.3 malformed JWT HTTP $malformed_code"
          [[ "$malformed_code" == "401" ]]

          JWT_KEY="$(gcloud secrets versions access latest --project="$PROJECT_ID" --secret="$JWT_SECRET")"
          [[ -n "$JWT_KEY" ]]
          echo "::add-mask::$JWT_KEY"
          export JWT_KEY
          export JWT_ISSUER="$(jq -r '.Jwt.Issuer' src/WebApi/appsettings.json)"
          export JWT_AUDIENCE="$(jq -r '.Jwt.Audience' src/WebApi/appsettings.json)"

          mint_token() {
            local permission="$1"
            local company_scope="$2"
            local location_scope="${3:-}"
            local terminal_scope="${4:-}"
            PERMISSION="$permission" COMPANY_SCOPE="$company_scope" LOCATION_SCOPE="$location_scope" TERMINAL_SCOPE="$terminal_scope" python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time

          def b64(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          now = int(time.time())
          header = {"alg": "HS256", "typ": "JWT"}
          payload = {
              "sub": "w23-readonly-runtime",
              "iss": os.environ["JWT_ISSUER"],
              "aud": os.environ["JWT_AUDIENCE"],
              "iat": now,
              "nbf": now - 5,
              "exp": now + 600,
              "company_scope": os.environ["COMPANY_SCOPE"],
          }
          permission = os.environ.get("PERMISSION", "")
          location_scope = os.environ.get("LOCATION_SCOPE", "")
          terminal_scope = os.environ.get("TERMINAL_SCOPE", "")
          if permission:
              payload["permission"] = permission
          if location_scope:
              payload["location_scope"] = location_scope
          if terminal_scope:
              payload["terminal_scope"] = terminal_scope
          encoded_header = b64(json.dumps(header, separators=(",", ":")).encode())
          encoded_payload = b64(json.dumps(payload, separators=(",", ":")).encode())
          unsigned = f"{encoded_header}.{encoded_payload}"
          signature = hmac.new(os.environ["JWT_KEY"].encode(), unsigned.encode(), hashlib.sha256).digest()
          print(f"{unsigned}.{b64(signature)}")
          PY
          }

          no_permission_token="$(mint_token '' 'demo-org')"
          echo "::add-mask::$no_permission_token"
          missing_permission_code="$(curl -sS -H "Authorization: Bearer $no_permission_token" -H 'X-Organization-Id: demo-org' -o "$tmp/missing-permission.json" -w '%{http_code}' "$target")"
          unset no_permission_token
          echo "W2.3 missing sales.read HTTP $missing_permission_code"
          [[ "$missing_permission_code" == "403" ]]
          jq -e '.code == "permission_denied"' "$tmp/missing-permission.json" >/dev/null

          sales_token="$(mint_token 'sales.read' 'demo-org')"
          echo "::add-mask::$sales_token"
          scope_code="$(curl -sS -H "Authorization: Bearer $sales_token" -H 'X-Organization-Id: w23-outside-org' -o "$tmp/scope.json" -w '%{http_code}' "$target")"
          echo "W2.3 organization scope escape HTTP $scope_code"
          [[ "$scope_code" == "403" ]]
          jq -e '.code == "organization_scope_denied"' "$tmp/scope.json" >/dev/null

          empty_code="$(curl -sS -D "$tmp/empty.headers" -H "Authorization: Bearer $sales_token" -H 'X-Organization-Id: demo-org' -o "$tmp/empty.json" -w '%{http_code}' "$target")"
          echo "W2.3 sales.read empty-location-scope HTTP $empty_code"
          [[ "$empty_code" == "200" ]]
          jq -e '
            .organizationId == "demo-org"
            and (.generatedAtUtc | type == "string" and length > 0)
            and (.contexts | type == "array" and length == 0)
            and ((keys | sort) == ["contexts", "generatedAtUtc", "organizationId"])
          ' "$tmp/empty.json" >/dev/null

          cache_control="$(header_value 'cache-control' "$tmp/empty.headers")"
          [[ "$cache_control" == *"private"* ]]
          [[ "$cache_control" == *"no-cache"* ]]

          etag="$(header_value 'etag' "$tmp/empty.headers")"
          [[ -n "$etag" ]]
          echo "W2.3 cache + ETag PASS"

          repeat_code="$(curl -sS -D "$tmp/repeat.headers" -H "Authorization: Bearer $sales_token" -H 'X-Organization-Id: demo-org' -o "$tmp/repeat.json" -w '%{http_code}' "$target")"
          [[ "$repeat_code" == "200" ]]
          repeat_etag="$(header_value 'etag' "$tmp/repeat.headers")"
          [[ "$repeat_etag" == "$etag" ]]
          echo "W2.3 stable ETag PASS"

          not_modified_code="$(curl -sS -D "$tmp/not-modified.headers" -H "Authorization: Bearer $sales_token" -H 'X-Organization-Id: demo-org' -H "If-None-Match: $etag" -o "$tmp/not-modified.body" -w '%{http_code}' "$target")"
          [[ "$not_modified_code" == "304" ]]
          [[ ! -s "$tmp/not-modified.body" ]]
          not_modified_etag="$(header_value 'etag' "$tmp/not-modified.headers")"
          [[ "$not_modified_etag" == "$etag" ]]
          echo "W2.3 If-None-Match 304 PASS"

          scoped_token="$(mint_token 'sales.read' 'demo-org' 'w23-runtime-no-match-location')"
          echo "::add-mask::$scoped_token"
          scoped_code="$(curl -sS -D "$tmp/scoped.headers" -H "Authorization: Bearer $scoped_token" -H 'X-Organization-Id: demo-org' -o "$tmp/scoped.json" -w '%{http_code}' "$target")"
          unset scoped_token
          [[ "$scoped_code" == "200" ]]
          jq -e '.organizationId == "demo-org" and (.contexts | type == "array")' "$tmp/scoped.json" >/dev/null
          scoped_etag="$(header_value 'etag' "$tmp/scoped.headers")"
          [[ -n "$scoped_etag" ]]
          [[ "$scoped_etag" != "$etag" ]]
          echo "W2.3 scope-sensitive ETag PASS"

          unset sales_token JWT_KEY JWT_ISSUER JWT_AUDIENCE

          {
            echo "## W2.3 Read-only Runtime Acceptance"
            echo
            echo "- Revision: $ACCEPTED_REVISION"
            echo "- OpenAPI exact GET-only surface: PASS"
            echo "- Unauthenticated: 401 PASS"
            echo "- Malformed JWT: 401 PASS"
            echo "- Missing sales.read: 403 permission_denied PASS"
            echo "- Organization scope escape: 403 organization_scope_denied PASS"
            echo "- sales.read without organization.read: 200 PASS"
            echo "- Empty location scope: 200 + empty contexts PASS"
            echo "- Cache-Control private, no-cache: PASS"
            echo "- Stable ETag: PASS"
            echo "- Scope-sensitive ETag: PASS"
            echo "- If-None-Match: 304 + empty body PASS"
            echo "- Production writes: NONE"
            echo "- Fixture creation: NONE"
          } >> "$GITHUB_STEP_SUMMARY"
