name: One-shot Daily Report monetary quantization

on:
  push:
    branches:
      - blueprint/fiscal-daily-report-monetary-quantization

permissions:
  contents: write

jobs:
  apply:
    runs-on:
      - self-hosted
      - linux
      - x64
      - efactura-ci
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: blueprint/fiscal-daily-report-monetary-quantization
          fetch-depth: 0

      - name: Configure persistent runner caches
        run: |
          echo "DOTNET_INSTALL_DIR=${RUNNER_TOOL_CACHE}/dotnet" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=${RUNNER_TOOL_CACHE}/nuget-packages" >> "$GITHUB_ENV"

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Apply governed patch
        run: python3 .github/one-shot/daily-report-quantization.py

      - name: Restore solution
        run: timeout 10m dotnet restore api-accounting.sln --disable-build-servers

      - name: Run focused architecture tests
        run: dotnet test test/ArchitectureTests/ArchitectureTests.csproj --configuration Release --no-restore --filter FullyQualifiedName~FiscalDailyReportWireReadinessArchitectureTests

      - name: Run focused cross-cutting tests
        run: dotnet test test/CrossCuttingTests/CrossCuttingTests.csproj --configuration Release --no-restore --filter FullyQualifiedName~FiscalDailyReportWireReadinessTests

      - name: Commit candidate and remove one-shot files
        run: |
          set -euo pipefail
          git config user.name "eFactura governed runner"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-daily-report-quantization.yml
          git rm .github/one-shot/daily-report-quantization.py
          git add src/Domain/Fiscal/FiscalDailyReportWireReadiness.cs
          git add src/Domain/Fiscal/FiscalDailyReportMonetaryQuantizer.cs
          git add test/CrossCuttingTests/FiscalDailyReportWireReadinessTests.cs
          git add test/ArchitectureTests/FiscalDailyReportWireReadinessArchitectureTests.cs
          git add documentation/blueprint-api-implementation/43_FISCAL_DAILY_REPORT_WIRE_READINESS.md
          git add documentation/blueprint-api-implementation/44_FISCAL_DAILY_REPORT_HIGH_VALUE_AUTOMATION.md
          git add documentation/blueprint-api-implementation/45_FISCAL_DAILY_REPORT_MONETARY_QUANTIZATION.md
          git commit -m "feat(fiscal): pin daily report monetary quantization"
          git push origin HEAD:blueprint/fiscal-daily-report-monetary-quantization
