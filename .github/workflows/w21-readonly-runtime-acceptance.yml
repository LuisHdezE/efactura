name: W2.1 Read-only Runtime Acceptance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/w21-readonly-runtime-acceptance.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: efactura-demo-0916-9b93
  REGION: us-east5
  SERVICE: efactura-api
  WIF_PROVIDER: projects/195831190862/locations/global/workloadIdentityPools/github-actions/providers/efactura-main
  DEPLOY_SERVICE_ACCOUNT: efactura-deploy@efactura-demo-0916-9b93.iam.gserviceaccount.com
  JWT_SECRET: efactura-jwt-key
  ACCEPTED_API_SHA: 9989c0f15d76423f76e25e1cfdc1ab1337586849
  ACCEPTED_REVISION: efactura-api-d22-9989c0f-55-1

jobs:
  acceptance:
    name: Governed W2.1 read-only runtime acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout acceptance source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify accepted API baseline remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$ACCEPTED_API_SHA" HEAD

          changed="$(git diff --name-only "$ACCEPTED_API_SHA"..HEAD)"
          backend_changed="$(printf '%s\n' "$changed" | grep -E '^(src/(WebApi|Application|Domain|Infrastructure|Shared)/|test/(ArchitectureTests|CrossCuttingTests|PersistenceIntegrationTests|UnitTest|UnitTests)/|api-accounting\.sln$|Directory\.(Build|Packages)\.|global\.json$)' || true)"

          if [[ -n "$backend_changed" ]]; then
            echo "Backend-sensitive changes detected after accepted API baseline:"
            printf '%s\n' "$backend_changed"
            exit 1
          fi

          echo "Accepted W2.1 API baseline remains unchanged."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify accepted Cloud Run revision
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --platform=managed --format=json)"
          revision="$(jq -r '.status.traffic[] | select((.percent // 0) == 100) | .revisionName // empty' <<< "$service_json" | head -n1)"
          base_url="$(jq -r '.status.url // empty' <<< "$service_json")"
          echo "100% revision: $revision"
          [[ "$revision" == "$ACCEPTED_REVISION" ]]
          [[ -n "$base_url" ]]
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"

      - name: Run W2.1 read-only production acceptance
        shell: bash
        env:
          BASE_URL: ${{ steps.runtime.outputs.base_url }}
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/w21-readonly"
          mkdir -p "$tmp"

          openapi_code="$(curl -sS -o "$tmp/openapi.json" -w '%{http_code}' "$BASE_URL/swagger/v1/swagger.json")"
          echo "OpenAPI HTTP $openapi_code"
          [[ "$openapi_code" == "200" ]]

          jq -e '
            .paths["/api/v1/sales/{saleId}/fiscalization"].get.operationId == "getSaleFiscalizationStatus"
            and (.paths["/api/v1/sales/{saleId}/fiscalization"].post == null)
            and (.paths["/api/v1/sales/{saleId}/fiscalization"].put == null)
            and (.paths["/api/v1/sales/{saleId}/fiscalization"].patch == null)
            and (.paths["/api/v1/sales/{saleId}/fiscalization"].delete == null)
          ' "$tmp/openapi.json" >/dev/null
          echo "OpenAPI W2.1 surface PASS"

          target="$BASE_URL/api/v1/sales/00000000-0000-0000-0000-000000000001/fiscalization"

          unauth_code="$(curl -sS -o "$tmp/unauth.json" -w '%{http_code}' "$target")"
          echo "W2.1 without JWT HTTP $unauth_code"
          [[ "$unauth_code" == "401" ]]

          malformed_code="$(curl -sS -H 'Authorization: Bearer malformed.jwt.value' -o "$tmp/malformed.json" -w '%{http_code}' "$target")"
          echo "W2.1 malformed JWT HTTP $malformed_code"
          [[ "$malformed_code" == "401" ]]

          JWT_KEY="$(gcloud secrets versions access latest --project="$PROJECT_ID" --secret="$JWT_SECRET")"
          [[ -n "$JWT_KEY" ]]
          echo "::add-mask::$JWT_KEY"
          export JWT_KEY
          export JWT_ISSUER="$(jq -r '.Jwt.Issuer' src/WebApi/appsettings.json)"
          export JWT_AUDIENCE="$(jq -r '.Jwt.Audience' src/WebApi/appsettings.json)"

          mint_token() {
            local permission="$1"
            local company_scope="$2"
            PERMISSION="$permission" COMPANY_SCOPE="$company_scope" python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time

          def b64(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          now = int(time.time())
          header = {"alg": "HS256", "typ": "JWT"}
          payload = {
              "sub": "w21-readonly-runtime",
              "iss": os.environ["JWT_ISSUER"],
              "aud": os.environ["JWT_AUDIENCE"],
              "iat": now,
              "nbf": now - 5,
              "exp": now + 600,
              "company_scope": os.environ["COMPANY_SCOPE"],
          }
          permission = os.environ.get("PERMISSION", "")
          if permission:
              payload["permission"] = permission
          encoded_header = b64(json.dumps(header, separators=(",", ":")).encode())
          encoded_payload = b64(json.dumps(payload, separators=(",", ":")).encode())
          unsigned = f"{encoded_header}.{encoded_payload}"
          signature = hmac.new(os.environ["JWT_KEY"].encode(), unsigned.encode(), hashlib.sha256).digest()
          print(f"{unsigned}.{b64(signature)}")
          PY
          }

          no_permission_token="$(mint_token '' 'w21-runtime-readonly')"
          echo "::add-mask::$no_permission_token"
          missing_permission_code="$(curl -sS -H "Authorization: Bearer $no_permission_token" -o "$tmp/missing-permission.json" -w '%{http_code}' "$target")"
          unset no_permission_token
          echo "W2.1 missing sales.read HTTP $missing_permission_code"
          [[ "$missing_permission_code" == "403" ]]

          sales_token="$(mint_token 'sales.read' 'w21-runtime-a')"
          echo "::add-mask::$sales_token"
          scope_code="$(curl -sS -H "Authorization: Bearer $sales_token" -H 'X-Organization-Id: w21-runtime-b' -o "$tmp/scope.json" -w '%{http_code}' "$target")"
          echo "W2.1 organization scope escape HTTP $scope_code"
          [[ "$scope_code" == "403" ]]
          jq -e '.code == "organization_scope_denied"' "$tmp/scope.json" >/dev/null

          not_found_code="$(curl -sS -H "Authorization: Bearer $sales_token" -H 'X-Organization-Id: w21-runtime-a' -o "$tmp/not-found.json" -w '%{http_code}' "$target")"
          unset sales_token
          echo "W2.1 authenticated unknown sale HTTP $not_found_code"
          [[ "$not_found_code" == "404" ]]
          jq -e '.code == "sales.not_found"' "$tmp/not-found.json" >/dev/null

          unset JWT_KEY JWT_ISSUER JWT_AUDIENCE

          {
            echo "## W2.1 Read-only Runtime Acceptance"
            echo
            echo "- Revision: $ACCEPTED_REVISION"
            echo "- OpenAPI exact W2.1 surface: PASS"
            echo "- Unauthenticated: 401 PASS"
            echo "- Malformed JWT: 401 PASS"
            echo "- Missing sales.read: 403 PASS"
            echo "- Organization scope escape: 403 organization_scope_denied PASS"
            echo "- Authenticated unknown sale: 404 sales.not_found PASS"
            echo "- Production writes: NONE"
            echo "- Fixture creation: NONE"
          } >> "$GITHUB_STEP_SUMMARY"
