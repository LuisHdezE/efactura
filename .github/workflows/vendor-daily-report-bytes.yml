name: Vendor Daily Report DGI Bytes

on:
  push:
    branches:
      - blueprint/fiscal-daily-report-byte-pin

permissions:
  contents: write

jobs:
  vendor:
    runs-on: [self-hosted, linux, x64, efactura-ci]
    steps:
      - name: Checkout byte-pin branch
        uses: actions/checkout@v4
        with:
          ref: blueprint/fiscal-daily-report-byte-pin
          fetch-depth: 0

      - name: Recover immutable mirror bytes and attest hashes
        shell: bash
        run: |
          set -euo pipefail

          MIRROR_REPO="olagopirez/factible"
          MIRROR_COMMIT="9a24a598e9470c4a1c5c34cb0cb253d08ffa3db3"
          SPEC_BASE="https://raw.githubusercontent.com/${MIRROR_REPO}/${MIRROR_COMMIT}/packages/cfe/spec"
          TARGET="src/Infrastructure/Fiscal/Schemas/DgiFeV1_44_2"
          EXAMPLE_NAME="Rep_219000090011_20120511_01_Ej_Mod_27032014.xml"

          mkdir -p "${TARGET}/Examples"

          curl --fail --location --silent --show-error \
            "${SPEC_BASE}/xsd/ReporteDiarioCFE.xsd" \
            --output "${TARGET}/ReporteDiarioCFE.xsd"
          curl --fail --location --silent --show-error \
            "${SPEC_BASE}/${EXAMPLE_NAME}" \
            --output "${TARGET}/Examples/${EXAMPLE_NAME}"

          test "$(git hash-object "${TARGET}/ReporteDiarioCFE.xsd")" = "eaa0d0b59f689af7c91e28f4c0882c9212e25ae9"
          test "$(git hash-object "${TARGET}/Examples/${EXAMPLE_NAME}")" = "0e92d35b2ee12fa6010275dc43ffcc9665d04e7a"
          test "$(git hash-object "${TARGET}/DGITypes.xsd")" = "5ee48a1a1e727d7be71c5d8d14983ba576edf67e"
          test "$(git hash-object "${TARGET}/xmldsig-core-schema.xsd")" = "df126b30e684091b32a748cd2e408f5fb9d651a9"

          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess

          root = pathlib.Path("src/Infrastructure/Fiscal/Schemas/DgiFeV1_44_2")
          example_name = "Rep_219000090011_20120511_01_Ej_Mod_27032014.xml"

          def artifact(path: pathlib.Path, mirror_path: str):
              raw = path.read_bytes()
              git_sha = subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()
              return {
                  "path": str(path).replace("\\", "/"),
                  "mirrorPath": mirror_path,
                  "byteLength": len(raw),
                  "gitBlobSha1": git_sha,
                  "sha256": hashlib.sha256(raw).hexdigest(),
              }

          manifest = {
              "artifactSetId": "dgi-daily-report-v13.2-byte-pin",
              "functionalFormatVersion": "13.2",
              "schemaArchiveVersion": "1.44.2",
              "officialAuthority": "Dirección General Impositiva (DGI), Uruguay",
              "officialRegistryUrl": "https://www.efactura.dgi.gub.uy/principal/ampliacion_de_contenido/documentos-de-interes?es=",
              "officialFormatUrl": "https://www.efactura.dgi.gub.uy/files/formato_reporte_cfe_v13_2-pdf?es=",
              "officialExampleUrl": "https://www.efactura.dgi.gub.uy/files/ejemplo-de-reporte?es=",
              "officialSchemaArchiveUrl": "https://www.efactura.dgi.gub.uy/files/xsds_fe_1_44_2-zip?es=",
              "byteRecoverySource": {
                  "repository": "olagopirez/factible",
                  "commit": "9a24a598e9470c4a1c5c34cb0cb253d08ffa3db3",
                  "role": "immutable byte-recovery mirror only; DGI remains the regulatory authority for publication status and functional format",
              },
              "artifacts": {
                  "reportSchema": artifact(
                      root / "ReporteDiarioCFE.xsd",
                      "packages/cfe/spec/xsd/ReporteDiarioCFE.xsd",
                  ),
                  "officialExample": artifact(
                      root / "Examples" / example_name,
                      f"packages/cfe/spec/{example_name}",
                  ),
                  "schemaClosure": [
                      artifact(root / "DGITypes.xsd", "packages/cfe/spec/xsd/DGITypes.xsd"),
                      artifact(root / "xmldsig-core-schema.xsd", "packages/cfe/spec/xsd/xmldsig-core-schema.xsd"),
                  ],
              },
              "schemaFacts": {
                  "targetNamespace": "http://cfe.dgi.gub.uy",
                  "rootElement": "Reporte",
                  "rootType": "ReporteDefType",
                  "caratulaElement": "Caratula",
                  "caratulaVersion": "1.0",
                  "xmlDsigNamespace": "http://www.w3.org/2000/09/xmldsig#",
                  "signatureElement": "Signature",
                  "signatureIsRequiredFinalChild": True,
                  "embeddedSchemaCommentVersion": "1.37.6i",
                  "exampleHistoricalSchemaLocation": "ReporteDiarioCFE_v1.15.xsd",
              },
              "safetyBoundary": {
                  "functionalFormatAndXsdAreIndependentGates": True,
                  "exampleSignatureAlgorithmsAreHistoricalEvidenceOnly": True,
                  "serializerImplementationIncluded": False,
              },
          }

          (root / "daily-report-schema-manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          git rm .github/workflows/vendor-daily-report-bytes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TARGET}/ReporteDiarioCFE.xsd" "${TARGET}/Examples/${EXAMPLE_NAME}" "${TARGET}/daily-report-schema-manifest.json"
          git commit -m "chore(fiscal): vendor daily report schema artifacts"
          git push origin HEAD:blueprint/fiscal-daily-report-byte-pin
