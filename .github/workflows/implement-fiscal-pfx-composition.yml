name: Apply fiscal PFX composition once

on:
  push:
    branches:
      - blueprint/fiscal-pfx-certificate-composition
    paths:
      - .github/workflows/implement-fiscal-pfx-composition.yml

permissions:
  contents: write

jobs:
  compose:
    runs-on: [self-hosted, linux, x64, efactura-ci]
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: blueprint/fiscal-pfx-certificate-composition
          fetch-depth: 0

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Apply exact composition edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/Application/Fiscal/FiscalSigningEvidenceWorkflow.cs",
              "    string SigningPayloadHash,\n    DateTimeOffset SigningTimestamp);",
              "    string SigningPayloadHash,\n    DateTimeOffset SigningTimestamp,\n    string OrganizationId = \"\");")

          replace_once(
              "src/Application/Fiscal/FiscalSignedArtifactWorkflow.cs",
              "                    payload.ContentHash,\n                    payload.SigningTimestamp),",
              "                    payload.ContentHash,\n                    payload.SigningTimestamp,\n                    organizationId),")

          replace_once(
              "src/Infrastructure/Persistence/V1/V1PersistenceServiceCollectionExtensions.cs",
              "        services.AddSingleton<IFiscalSignedCfeSchemaValidator, DgiFeV1_44_2SignedCfeSchemaValidator>();\n",
              "        services.AddSingleton<IFiscalSignedCfeSchemaValidator, DgiFeV1_44_2SignedCfeSchemaValidator>();\n        services.AddSingleton<IFiscalSigningTimeSource, UruguayFiscalSigningTimeSource>();\n        services.AddSingleton<IFiscalSigningCertificateSource, PfxFiscalSigningCertificateSource>();\n        services.AddSingleton<IFiscalSignatureProvider, XmlDsigFiscalSignatureProvider>();\n")

          replace_once(
              "test/ArchitectureTests/FiscalSignedArtifactArchitectureTests.cs",
              "    public void Composition_registers_storage_and_payload_builder_but_not_a_secret_source()\n",
              "    public void Composition_registers_storage_payload_builder_and_explicit_secret_source_boundary()\n")

          replace_once(
              "test/ArchitectureTests/FiscalSignedArtifactArchitectureTests.cs",
              "        Assert.DoesNotContain(\"IFiscalSigningCertificateSource\", services, StringComparison.Ordinal);\n        Assert.DoesNotContain(\"Pfx\", services, StringComparison.OrdinalIgnoreCase);\n        Assert.DoesNotContain(\"KeyVault\", services, StringComparison.OrdinalIgnoreCase);",
              "        Assert.Contains(\"IFiscalSigningCertificateSource, PfxFiscalSigningCertificateSource\", services, StringComparison.Ordinal);\n        Assert.Contains(\"IFiscalSignatureProvider, XmlDsigFiscalSignatureProvider\", services, StringComparison.Ordinal);\n        Assert.DoesNotContain(\"KeyVault\", services, StringComparison.OrdinalIgnoreCase);")
          PY

      - name: Restore solution
        run: dotnet restore api-accounting.sln

      - name: Run focused architecture and cross-cutting tests
        shell: bash
        run: |
          dotnet test test/ArchitectureTests/ArchitectureTests.csproj -c Release --no-restore
          dotnet test test/CrossCuttingTests/CrossCuttingTests.csproj -c Release --no-restore

      - name: Commit candidate and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/implement-fiscal-pfx-composition.yml
          git config user.name "MSc Luis A. Hernández Elias"
          git config user.email "88979457+LuisHdezE@users.noreply.github.com"
          git add -A
          git commit -m "feat(fiscal): compose organization-scoped PFX signing identity"
          git push origin HEAD:blueprint/fiscal-pfx-certificate-composition
